<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Top Training</title>
<style>
/* v12: Industrial Midnight retheme — see blue-top-design-system.css /
   blue-top-design-system-guide.md for the full token rationale. Status red
   is kept distinct from brand orange on purpose (so a "below benchmark"
   pill doesn't visually blend into a CTA button); green is unchanged. */
:root{
  --bg:#060B18; --panel:#121A2D; --panel2:#182238; --border:#2A364F;
  --text:#FFFFFF; --text-dim:#94A3B8; --text-mute:#64748B;
  --accent:#FF5722; --accent-dim:#5A2413; --accent-hover:#E64A19;
  --gold:#FFC107; --green:#2FBF71; --amber:#FFC107; --red:#EF4444;
  --radius:6px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#333338;border-radius:4px;}

/* ---------- Login ---------- */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#1c1c20,var(--bg));}
.login-card{width:360px;max-width:90vw;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:36px 32px;}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.brand-wordmark{font-weight:900;text-transform:uppercase;letter-spacing:0.12em;color:var(--text);font-size:15px;}
.brand-wordmark.lg{font-size:21px;letter-spacing:0.08em;}
.login-sub{color:var(--text-dim);font-size:13px;margin-bottom:26px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;}
.field input,.field select{width:100%;padding:11px 12px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:8px;border:none;font-size:14px;font-weight:600;}
.btn-primary{background:var(--accent);color:#fff;width:100%;margin-top:8px;}
.btn-primary:hover{background:var(--accent-hover);}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn-ghost:hover{border-color:#48484e;}
.demo-row{display:flex;gap:8px;margin-top:18px;}
.demo-row button{flex:1;font-size:12px;padding:9px;}
.login-note{font-size:11px;color:var(--text-mute);margin-top:18px;line-height:1.5;text-align:center;}

/* ---------- App shell ---------- */
#app-shell{display:none;min-height:100vh;}
#app-shell.active{display:flex;}
.sidebar{width:clamp(230px,22vw,320px);flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:hidden;}
/* Lauhala weave — subtle woven-mat texture on the sidebar surface, sourced
   from blue-top-design-system.css Section 3 (Option A: layered CSS
   gradients, no image asset). Sits behind nav content via z-index. */
.sidebar::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0.09;
  background-image:
    repeating-linear-gradient(45deg, rgba(201,162,39,0.9) 0px, rgba(201,162,39,0.9) 3px, transparent 3px, transparent 12px),
    repeating-linear-gradient(-45deg, rgba(139,94,40,0.9) 0px, rgba(139,94,40,0.9) 3px, transparent 3px, transparent 12px),
    repeating-linear-gradient(45deg, rgba(0,0,0,0.6) 0px, rgba(0,0,0,0.6) 1px, transparent 1px, transparent 12px);
  background-blend-mode:overlay, overlay, multiply;
  background-size:14px 14px;
}
.sidebar #nav-items,.sidebar .nav-spacer,.sidebar .sidebar-foot{position:relative;z-index:1;}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:0 8px 22px 8px;border-bottom:1px solid var(--border);margin-bottom:14px;position:relative;z-index:1;}
.nav-item{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:8px;color:var(--text-dim);font-size:13.5px;font-weight:600;margin-bottom:2px;}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:var(--panel2);color:var(--text);}
.nav-item.active{background:var(--accent-dim);color:#fff;}
.nav-spacer{flex:1;}
.nav-section-label{font-size:10px;text-transform:uppercase;letter-spacing:0.6px;color:var(--text-mute);padding:14px 10px 6px;}
.sidebar-foot{border-top:1px solid var(--border);padding-top:12px;margin-top:8px;}
.role-badge{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--panel2);color:var(--text-dim);display:inline-block;margin-left:6px;text-transform:uppercase;letter-spacing:0.4px;}
/* nav labels: full label on desktop sidebar, short label only shows once the
   mobile media query below flips these two rules */
.nav-label-short{display:none;}
.nav-label-full{display:inline;}

.main{flex:1;min-width:0;padding:28px 36px 60px;max-width:1120px;}
.page-head{margin-bottom:24px;}
.page-head h1{font-size:21px;margin:0 0 4px;font-weight:900;text-transform:uppercase;letter-spacing:0.05em;}
.page-head .sub{color:var(--text-dim);font-size:13.5px;}
.crumbs{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px;}

.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:16px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.02);}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.card-title{font-size:15px;font-weight:700;}
.card-tag{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.5px;}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
.pill-green{background:rgba(47,191,113,0.14);color:var(--green);}
.pill-amber{background:rgba(224,167,46,0.14);color:var(--amber);}
.pill-red{background:rgba(224,38,62,0.14);color:var(--red);}
.pill-neutral{background:var(--panel2);color:var(--text-dim);}

/* category grid */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.cat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;transition:border-color .15s;}
.cat-card:hover{border-color:var(--accent);cursor:pointer;}
.cat-card .icn{width:36px;height:36px;border-radius:9px;background:var(--panel2);display:flex;align-items:center;justify-content:center;margin-bottom:12px;}
.cat-card .icn svg{width:19px;height:19px;color:var(--accent);}
.cat-card h3{font-size:14.5px;margin:0 0 4px;}
.cat-card p{font-size:12px;color:var(--text-dim);margin:0;line-height:1.5;}

/* exercise/drill rows (RP-style logging) */
.item-block{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
.item-block-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 12px;}
.item-block-head h4{margin:0 0 2px;font-size:14.5px;}
.item-block-head .meta{font-size:11.5px;color:var(--text-dim);}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:10px;align-items:center;padding:6px 18px;}
.set-row.head{color:var(--text-mute);font-size:10.5px;text-transform:uppercase;letter-spacing:0.4px;padding-bottom:8px;}
.set-row input[type=text],.set-row input[type=number]{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:8px 9px;color:var(--text);font-size:13px;text-align:center;}
.set-num{color:var(--text-mute);font-size:12px;text-align:center;}
.log-box{width:22px;height:22px;border-radius:5px;border:2px solid var(--border);background:transparent;display:flex;align-items:center;justify-content:center;margin:0 auto;}
.log-box.done{background:var(--green);border-color:var(--green);}
.log-box.done svg{width:13px;height:13px;color:#0c1f14;}
.item-block-foot{padding:10px 18px 16px;}
.simple-check-row{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-top:1px solid var(--border);}
.simple-check-row:first-of-type{border-top:none;}
.simple-check-row .label{font-size:13.5px;}
.simple-check-row .desc{font-size:11.5px;color:var(--text-dim);margin-top:2px;}

/* program grid */
.week-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.week-tab{padding:8px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-dim);}
.week-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.day-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
.day-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.day-card .dname{font-size:12.5px;font-weight:700;margin-bottom:8px;}
.day-card .dcats{display:flex;flex-direction:column;gap:5px;}
.day-chip{font-size:10.5px;background:var(--panel2);color:var(--text-dim);padding:4px 8px;border-radius:6px;}
.day-card .dgo{margin-top:12px;width:100%;font-size:11.5px;padding:8px;}

/* builder */
.builder-day-col{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;min-width:190px;}
.builder-row{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;}
.builder-day-col select{width:100%;margin-bottom:10px;}
.builder-cat-tag{display:flex;align-items:center;justify-content:space-between;background:var(--panel2);padding:7px 9px;border-radius:6px;font-size:11.5px;margin-bottom:6px;}
.builder-cat-tag button{background:none;border:none;color:var(--text-mute);font-size:14px;line-height:1;}
.add-cat-btn{width:100%;padding:8px;font-size:11.5px;border:1px dashed var(--border);border-radius:6px;background:transparent;color:var(--text-dim);}
.add-day-col{min-width:120px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);border-radius:var(--radius);color:var(--text-dim);font-size:12.5px;font-weight:600;}

/* dashboard */
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px;}
.metric-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;}
.metric-card .mval{font-size:24px;font-weight:700;}
.metric-card .mlabel{font-size:11.5px;color:var(--text-dim);margin-top:2px;}
.metric-card .mtrend{font-size:11px;margin-top:8px;}
.chart-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
.bars{display:flex;align-items:flex-end;gap:18px;height:140px;margin-top:14px;}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;}
.bar-col .bar{width:100%;max-width:38px;background:var(--accent);border-radius:4px 4px 0 0;}
.bar-col .blabel{font-size:10.5px;color:var(--text-dim);}
.bar-col .bval{font-size:11px;font-weight:700;}

/* philosophy */
.phil-text{font-size:14.5px;line-height:1.8;color:var(--text);white-space:pre-wrap;}
.phil-text b{color:#fff;}

.session-panel{background:var(--panel);border:1px solid var(--accent-dim);border-radius:var(--radius);padding:16px 20px;margin-bottom:18px;}
.session-empty{color:var(--text-mute);font-size:12.5px;margin-top:4px;}
.session-item{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:13px;border-top:1px solid var(--border);}
.session-item:first-of-type{border-top:none;margin-top:6px;}
.session-item button{background:none;border:none;color:var(--text-mute);font-size:16px;line-height:1;padding:0 4px;}
.drill-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--border);font-size:13.5px;}
.drill-row:first-of-type{border-top:none;}
.add-btn{font-size:11.5px;padding:6px 13px;border-radius:6px;background:var(--panel2);border:1px solid var(--border);color:var(--text);white-space:nowrap;}
.add-btn.added{background:rgba(47,191,113,0.14);color:var(--green);border-color:transparent;}
.toast-banner{background:rgba(47,191,113,0.14);border:1px solid var(--green);color:var(--green);border-radius:8px;padding:11px 16px;font-size:13px;font-weight:600;margin-bottom:16px;}
.video-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
.video-thumb{height:90px;background:var(--panel2);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;}
.video-thumb svg{width:26px;height:26px;color:var(--text-mute);}
.video-badge{position:absolute;bottom:8px;right:10px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;background:rgba(0,0,0,0.55);color:#fff;padding:3px 8px;border-radius:20px;}
.video-info{padding:12px 14px;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:50;}
.modal-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:22px 24px;width:420px;max-width:90vw;}
.video-placeholder{background:var(--panel2);border-radius:10px;padding:40px 20px;text-align:center;margin-top:6px;}
.video-placeholder svg{width:30px;height:30px;color:var(--text-mute);}
.video-toggle-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);font-size:11px;font-weight:600;flex-shrink:0;}
.video-toggle-btn svg{width:13px;height:13px;}
.video-empty-inline{font-size:11.5px;color:var(--text-mute);margin-top:8px;padding:10px 12px;background:var(--panel2);border-radius:8px;}
.video-link-inline{display:inline-block;margin-top:8px;font-size:12.5px;color:var(--accent);font-weight:600;}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-dim);}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-mute);margin:22px 0 10px;font-weight:700;}
.section-label:first-child{margin-top:0;}
.hint{font-size:12px;color:var(--text-mute);margin-top:10px;}
.top-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:16px;}
.search-box{width:100%;padding:11px 14px;background:var(--panel);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:13.5px;margin-bottom:16px;}
.lib-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.lib-item{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:13px 15px;}
.lib-item .n{font-size:13.5px;font-weight:600;}
.lib-item .t{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:0.3px;margin-top:3px;}
@media (max-width:860px){.cat-grid,.metric-grid,.lib-grid{grid-template-columns:1fr;}}

/* ---------- v8: mobile (phone-width) layout ----------
   The desktop left sidebar becomes a fixed bottom tab bar — the pattern the
   RP Strength reference app uses on phones. Profile keeps its own nav-item
   in the bar; Sign Out drops out of the bar (see .sidebar-foot rule below)
   since it now lives as a button on the Profile page instead (renderProfile). */
@media (max-width:640px){
  .sidebar{
    position:fixed;left:0;right:0;bottom:0;top:auto;width:100%;height:auto;
    flex-direction:row;padding:2px 2px calc(2px + env(safe-area-inset-bottom));
    border-right:none;border-top:1px solid var(--border);z-index:40;
  }
  .sidebar .brand{display:none;}
  .nav-spacer{display:none;}
  /* #nav-items holds 6 icons, .sidebar-foot holds 1 (Profile, once Sign Out
     is hidden) — flex:6/flex:1 keeps every icon the same width across both
     containers instead of the two containers splitting the bar 50/50. */
  .sidebar-foot{border-top:none;padding-top:0;margin-top:0;display:flex;flex:1;}
  .sidebar-foot [onclick="signOut()"]{display:none;}
  #nav-items{display:flex;flex:6;}
  .sidebar .nav-item{
    flex:1;flex-direction:column;justify-content:center;gap:3px;
    padding:7px 2px;margin-bottom:0;border-radius:8px;text-align:center;
  }
  .sidebar .nav-item svg{width:20px;height:20px;}
  .nav-label-full{display:none;}
  .nav-label-short{display:block;font-size:9.5px;line-height:1.1;}

  #app-shell.active{display:flex;}
  .main{padding:16px 14px calc(78px + env(safe-area-inset-bottom));max-width:100%;}
  .page-head h1{font-size:19px;}

  /* app-like horizontal scroll strips instead of wrapping to many rows */
  .week-tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  .week-tab{flex-shrink:0;}

  .item-block-head{flex-wrap:wrap;gap:8px;}
  .item-block-head > button{width:100%;}

  .log-box{width:27px;height:27px;}
  .btn{min-height:40px;}

  .top-actions{flex-wrap:wrap;}
  .top-actions > button{flex:1;min-width:130px;}
}

/* v12: progress-ring / leaderboard-row — not used by any view yet, parked
   here per blue-top-design-system.css so they're ready the moment a
   completion-ring or standings feature gets built. */
.progress-ring{position:relative;width:64px;height:64px;}
.progress-ring svg{transform:rotate(-90deg);width:100%;height:100%;}
.progress-ring .track{fill:none;stroke:var(--border);stroke-width:6;}
.progress-ring .fill{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .3s ease;}
.progress-ring.complete .fill{stroke:var(--gold);}
.progress-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--text);}
.leaderboard-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--border);}
.leaderboard-row:last-child{border-bottom:none;}
.leaderboard-row .rank{width:26px;text-align:center;font-weight:900;color:var(--text-dim);}
.leaderboard-row.rank-1 .rank{color:var(--gold);}
.leaderboard-row.is-you{background:rgba(255,87,34,0.08);border-left:3px solid var(--accent);}
.leaderboard-row .name{flex:1;color:var(--text);font-weight:600;font-size:13.5px;}
.leaderboard-row .stat{color:var(--text-dim);font-size:12.5px;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo"><div class="brand-wordmark lg">BLUE TOP TRAINING</div></div>
    <div class="login-sub">Hard work builds ballplayers — and better people.</div>
    <div class="field">
      <label>Username</label>
      <input type="text" id="login-user" placeholder="e.g. josh or hitter1">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="login-pass" placeholder="demo123">
    </div>
    <button class="btn btn-primary" onclick="doLogin()">Log in</button>
    <div class="demo-row">
      <button class="btn btn-ghost" onclick="quickLogin('josh')">Demo: coach</button>
      <button class="btn btn-ghost" onclick="quickLogin('hitter1')">Demo: hitter</button>
    </div>
    <div class="login-note">Prototype login for testing with hitters — demo accounts, no real signup yet.<br>Coach: josh / demo123 &nbsp;·&nbsp; Hitter: hitter1 / demo123</div>
  </div>
</div>

<div id="app-shell">
  <div class="sidebar">
    <div class="brand"><div class="brand-wordmark">BLUE TOP TRAINING</div></div>
    <nav id="nav-items"></nav>
    <div class="nav-spacer"></div>
    <div class="sidebar-foot">
      <div class="nav-item" onclick="go('profile')" style="margin-bottom:2px;" data-nav="profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
        <span id="profile-nav-label">Profile</span>
      </div>
      <div class="nav-item" onclick="signOut()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>Sign out</span>
      </div>
    </div>
  </div>
  <div class="main" id="main"></div>
</div>

<script>
/* =========================================================================
   HITTING PROGRAM APP — v1 prototype
   Vanilla JS SPA. Sample content summarized from the Hitting Philosophy &
   Program doc, the Strength & Conditioning program, and the Hitter Metrics
   Tracker. localStorage is the v1 data layer (demo auth + program state).
   ========================================================================= */

const ICONS = {
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/><path d="M20 17v3"/>',
  chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 1 1-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 1 5.4-5.4z"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',

// Training Library. Deliberately NOT the Hitting Drills pattern (big
// always-visible thumbnail grid + modal) — these are drills athletes run

// toggle instead of one library-wide browsing experience.
let openInlineVideo = {};
function toggleInlineVideo(key, catId){
  openInlineVideo[key] = !openInlineVideo[key];
  go('category', catId);
}
function isDirectVideoFile(url){ return /\.(mp4|mov|webm|m4v)(\?|$)/i.test(url); }
function inlineVideoToggleBtn(key, catId){
  const open = !!openInlineVideo[key];
  return `<button class="video-toggle-btn" onclick="toggleInlineVideo('${key}','${catId}')">${icon('play')}<span>${open ? 'Hide' : 'Watch'}</span></button>`;
}
function inlineVideoBody(url){
  if(!url) return `<div class="video-empty-inline">No video added yet — this slot is ready as soon as one is uploaded.</div>`;
  if(isDirectVideoFile(url)) return `<video src="${url}" controls playsinline style="width:100%;border-radius:8px;margin-top:8px;background:#000;"></video>`;
  return `<a href="${url}" target="_blank" rel="noopener" class="video-link-inline">Watch video &#8599;</a>`;
}

function loadSwingVideo(input){

// markSwingPosition/setSwingKeyState/scrubTo deliberately do NOT call the
// app's normal go() full-innerHTML re-render. go() replaces #main's markup
// wholesale, which would tear down and recreate the <video> element and
// silently reset it to 0:00 on every checkpoint mark — exactly the moment
// the user needs playback position preserved. Instead these patch only the
// specific badge/button nodes via id, leaving the <video> element untouched.
function markSwingPosition(n){
  const v = document.getElementById("swing-video");
  if(!v) return;
  swingMarks[n] = v.currentTime;

function scrubTo(t){
  const v = document.getElementById("swing-video");
  if(v) v.currentTime = t;

function setSwingKeyState(id, val){

  const no = document.getElementById("key-btn-"+id+"-no");

  if(no) no.className = "btn " + (val===false ? "btn-primary" : "btn-ghost");
  if(yes) yes.style.width = "auto";
  if(no) no.style.width = "auto";
}
function saveSwingCheck(){

    date: new Date().toISOString(),

// Parse a display string like "4x5", "3x8/side", "6 reps", "15 min" into a
// set count + a per-set target label, so each set gets its own RP-style row.
function parseSets(str){
  let m = /^(\d+)\s*x\s*(.+)$/i.exec(str);
  if(m) return { count: parseInt(m[1],10), label: m[2].trim() };
  m = /^(\d+)\s*reps?$/i.exec(str);
  if(m) return { count: 1, label: m[1] + " reps" };
  m = /^(\d+)\s*min$/i.exec(str);
  if(m) return { count: 1, label: m[1] + " min" };
  return { count: 1, label: str };
}

function setKey(track, week, dayIdx, exIdx, setIdx){ return track+"-w"+week+"-d"+dayIdx+"-e"+exIdx+"-s"+setIdx; }
function getSetState(p, track, week, dayIdx, exIdx, setIdx){
  return p[track].sets[setKey(track,week,dayIdx,exIdx,setIdx)] || { weight:"", reps:"", logged:false };
}
function updateSetField(track, week, dayIdx, exIdx, setIdx, field, value){
  // onchange (not oninput) on purpose — commits on blur/Enter so re-saving
  // doesn't fight the user's cursor mid-keystroke.
  const p = loadScProgress();
  const key = setKey(track,week,dayIdx,exIdx,setIdx);
  const cur = p[track].sets[key] || { weight:"", reps:"", logged:false };
  cur[field] = value;
  p[track].sets[key] = cur;
  saveScProgress(p);
}
function toggleSetLog(track, week, dayIdx, exIdx, setIdx){
  const p = loadScProgress();
  const key = setKey(track,week,dayIdx,exIdx,setIdx);
  const cur = p[track].sets[key] || { weight:"", reps:"", logged:false };
  cur.logged = !cur.logged;
  p[track].sets[key] = cur;
  saveScProgress(p);
  maybeAutoCompleteDay(track, week, dayIdx);
  go("strength-hub");
}
function isScDayDone(p, track, week, dayIdx){ return !!p[track].days[track+"-w"+week+"-d"+dayIdx+"-DONE"]; }
function isScWeekDone(p, track, week){
  const days = scDaysForWeek(track, week);
  return days.every((d, di) => !!p[track].days[track+"-w"+week+"-d"+di+"-DONE"]);
}
function maybeAutoCompleteDay(track, week, dayIdx){
  const days = scDaysForWeek(track, week);
  const p = loadScProgress();
  const items = days[dayIdx].items;
  const allLogged = items.every((item, exIdx) => {
    const parsed = parseSets(item.sets);
    for(let s=0;s<parsed.count;s++) if(!getSetState(p, track, week, dayIdx, exIdx, s).logged) return false;
    return true;
  });
  if(allLogged) completeDay(track, week, dayIdx);
}
// Completing a day always logs every set in it. Auto-advancing the track's
// current-week pointer only happens when the week being completed IS the
// track's actual current week (A23) — editing a past week to fill in a gap
// never re-drives the pointer. v6: same rule now applies one level down —
// completing the track's actual current DAY (not a day you're just
// browsing) steps currentDay forward so only the next day shows.
function completeDay(track, week, dayIdx){
  const days = scDaysForWeek(track, week);
  const p = loadScProgress();
  const items = days[dayIdx].items;
  items.forEach((item, exIdx) => {
    const parsed = parseSets(item.sets);
    for(let s=0;s<parsed.count;s++){
      const key = setKey(track,week,dayIdx,exIdx,s);
      const cur = p[track].sets[key] || { weight:"", reps:"", logged:false };
      cur.logged = true;
      p[track].sets[key] = cur;
    }
  });
  p[track].days[track+"-w"+week+"-d"+dayIdx+"-DONE"] = true;
  let advancedWeek = false;
  let advancedDay = false;
  if(week === p[track].week){
    if(isScWeekDone(p, track, week)){
      const cap = SC_TOTAL_WEEKS[track];
      if(!cap || p[track].week <= cap){ p[track].week += 1; p[track].currentDay = 0; advancedWeek = true; }
    } else if(dayIdx === p[track].currentDay){
      p[track].currentDay = Math.min(p[track].currentDay + 1, days.length - 1);
      advancedDay = true;
    }
  }
  saveScProgress(p);
  // Follow the pointer forward in the view too, so the screen doesn't sit on
  // the day/week you just finished.
  if(advancedWeek) delete scViewDay[track+"-"+p[track].week];
  else if(advancedDay) scViewDay[track+"-"+week] = p[track].currentDay;
  go("strength-hub");
  if(advancedWeek) setTimeout(() => showToast("Week complete — moved to Week " + p[track].week + "."), 10);
}

// v8: two label spans per item — the full desktop label and a short mobile
// label — swapped purely via CSS media query (.nav-label-full/.nav-label-short)
// so the bottom tab bar on phones doesn't wrap or truncate mid-word.
function renderNav(){
  const el = document.getElementById("nav-items");
  el.innerHTML = NAV.map(n =>
    `<div class="nav-item" data-nav="${n.id}" onclick="go('${n.id}')">${icon(n.icon)}<span class="nav-label-full">${n.label}</span><span class="nav-label-short">${n.shortLabel}</span></div>`

function go(view, param){
  location.hash = view + (param ? "/"+param : "");
  document.querySelectorAll(".nav-item").forEach(el => el.classList.toggle("active", el.dataset.nav === view));
  const main = document.getElementById("main");
  if(view === "daily-plan") main.innerHTML = renderDailyPlan();
  else if(view === "strength-hub") main.innerHTML = renderStrengthHub();

  else if(view === "offseason-builder") main.innerHTML = renderOffseasonBuilder();

  // model above) but left defined, unreferenced, in case a future iteration
  // wants to resurrect coach-side views.

}

/* ---------------------- View: Current Workout ------------------------------ */

function todayDay(){
  const prog = programs[session.programId];
  const idx = new Date().getDay() % 4;
  return { prog, week: prog.weeks[0], day: prog.weeks[0].days[idx] };
}

function logKey(progId, weekNum, dayName, catId, itemIdx){
  return `${progId}|w${weekNum}|${dayName}|${catId}|${itemIdx}`;
}

function renderCurrent(){
  const prog = programs[session.programId];
  if(!prog) return `<div class="empty-state">No program assigned yet.</div>`;
  const week = prog.weeks[0];
  const day = week.days[0];
  let html = `<div class="page-head"><div class="crumbs">Today · Week ${week.weekNum}</div><h1>${day.name}</h1><div class="sub">${day.categories.map(c=>catSafe(c).name).join(" + ")} — log your sets below as you go.</div></div>`;

  day.categories.forEach(catId => {
    const cat = catSafe(catId);
    html += `<div class="section-label">${cat.name}</div>`;
    const items = sampleItemsFor(catId);
    items.forEach((it, i) => {
      const key = logKey(prog.id, week.weekNum, day.name, catId, i);
      const done = !!logs[key];
      html += `<div class="item-block">
        <div class="item-block-head">
          <div><h4>${it.name}</h4><div class="meta">${it.detail || ""}</div></div>
          <div class="log-box ${done?'done':''}" onclick="toggleLog('${key}', this)">${done?icon('check'):''}</div>
        </div>
      </div>`;
    });
  });
  html += `<div class="hint">Tap the checkbox on the right of each item to log it complete. Your log is saved automatically.</div>`;
  return html;
}

function sampleItemsFor(catId){
  if(catId === "warmup") return WARMUP.categories.flatMap(c => c.items.map(i => ({name:i.name, detail:c.name})));
  if(catId === "tee") return TEE.stations.map(s => ({name:s.name, detail:s.intent}));
  if(catId === "hittingworkout") return HITTING_DRILL_CATEGORIES.flatMap(c => c.drills.map(d => ({name:d, detail:c.name})));
  if(catId === "strength"){
    const day = STRENGTH.offSeason.blocks[0].days[0];
    return day.items.map(i => ({name:i.name, detail:(i.sets||"")+(i.note?" — "+i.note:"")}));
  }
  if(catId === "bat"){
    const wk = WEIGHTED_BAT.weeks[0];
    return [{name:"Week "+wk.wk+" — "+wk.focus, detail:wk.plan}];
  }
  return [];
}

function toggleLog(key, el){
  if(logs[key]){ delete logs[key]; el.classList.remove("done"); el.innerHTML=""; }
  else { logs[key] = true; el.classList.add("done"); el.innerHTML = icon('check'); }
  saveLogs(logs);
}

/* ---------------------- View: Strength & Conditioning hub (v2) ------------- */

let scTab = "offseason";
function setScTab(id){ scTab = id; go("strength-hub"); }

function renderStrengthHub(){
  const p = loadScProgress();
  const track = p[scTab];
  const tabLabel = SC_TABS.find(t=>t.id===scTab).label;
  const generic = scBlock(scTab);

  let html = `<div class="page-head"><h1>Strength & Conditioning</h1><div class="sub">Off-season build and in-season maintenance — conditioning is folded right into each day. One day shows at a time; log every set and it advances to the next day, then the next week, on its own.</div></div>`;
  html += `<div class="week-tabs">` + SC_TABS.map(t => `<div class="week-tab ${t.id===scTab?'active':''}" onclick="setScTab('${t.id}')">${t.label}</div>`).join("") + `</div>`;

  // v6: nothing renders until the track is explicitly started.
  if(!track.started){
    html += `<div class="card"><div class="card-title" style="margin-bottom:8px;">Start ${tabLabel}</div><div class="phil-text" style="font-size:13px;margin-bottom:16px;">${generic.focus}</div><button class="btn btn-primary" style="width:auto;padding:11px 22px;" onclick="startScTrack('${scTab}')">Start ${tabLabel}</button></div>`;
    return html;
  }

  html += `<div class="top-actions"><button class="btn btn-ghost" style="width:auto;padding:8px 14px;font-size:12px;" onclick="resetScTrack('${scTab}')">Reset ${tabLabel}</button></div>`;

  const cap = SC_TOTAL_WEEKS[scTab];
  const blockDone = cap && track.week > cap;
  const maxWeek = blockDone ? cap : track.week;
  const viewWeek = (scViewWeek[scTab] && scViewWeek[scTab] <= maxWeek) ? scViewWeek[scTab] : maxWeek;

  if(blockDone){
    html += `<div class="card"><div class="card-title" style="margin-bottom:6px;">Block complete</div><div class="phil-text" style="font-size:13px;margin-bottom:14px;">You've cleared all ${cap} weeks of ${tabLabel}. Use the weeks below to review or fix anything you missed — or start the block over from Week 1.</div><button class="btn btn-primary" style="width:auto;padding:9px 18px;" onclick="startOverScTrack('${scTab}')">Start Over</button></div>`;
  }

  html += `<div class="week-tabs" style="margin-bottom:6px;">` + Array.from({length:maxWeek}, (_,i)=>i+1).map(w => {
    const wDone = isScWeekDone(p, scTab, w);
    return `<div class="week-tab ${w===viewWeek?'active':''}" onclick="setScViewWeek('${scTab}',${w})">Week ${w}${wDone?' '+icon('check'):''}</div>`;
  }).join("") + `</div>`;

  // v7: which day-templates apply depends on the real week (off-season is
  // now 3 blocks of 4 weeks each) — meta carries the block label/focus and
  // the week's position in its RIR wave (null for in-season, which has no
  // blocks or wave).
  const meta = scBlockMetaForWeek(scTab, viewWeek);
  const days = scDaysForWeek(scTab, viewWeek);
  const blockLine = meta.weekInBlock
    ? `${meta.label} — Week ${meta.weekInBlock} of 4 (real Week ${viewWeek}) — Target: ${scRirLabel(meta.weekInBlock)}`
    : meta.focus;
  html += `<div class="card-tag" style="margin-bottom:4px;">${blockLine}</div>`;
  html += `<div class="phil-text" style="font-size:12.5px;color:var(--text-dim);margin-bottom:10px;">${meta.focus}${(!blockDone && viewWeek!==track.week) ? ' — viewing a past week' : ''}</div>`;

  // v6: only ONE day of the viewed week renders below — day-chips pick which.
  // Default day is the track's actual current day when viewing the active
  // week, or Day 1 when reviewing a past/completed week.
  const defaultDay = (viewWeek === track.week && !blockDone) ? track.currentDay : 0;
  const dayMapKey = scTab + "-" + viewWeek;
  const viewDay = (scViewDay[dayMapKey] !== undefined) ? scViewDay[dayMapKey] : defaultDay;

  html += `<div class="week-tabs" style="margin-bottom:16px;">` + days.map((d, di) => {
    const dDone = isScDayDone(p, scTab, viewWeek, di);
    const shortLabel = d.day.split(" — ")[0];
    return `<div class="week-tab ${di===viewDay?'active':''}" onclick="setScViewDay('${scTab}',${viewWeek},${di})">${shortLabel}${dDone?' '+icon('check'):''}</div>`;
  }).join("") + `</div>`;

  const di = viewDay;
  const d = days[di];
  const done = isScDayDone(p, scTab, viewWeek, di);
  html += `<div class="item-block"><div class="item-block-head"><div><h4>${d.day}</h4><div class="meta">${done ? 'Completed' : d.items.length+' exercises'}</div></div>` +
    `<button class="btn ${done?'btn-ghost':'btn-primary'}" style="width:auto;margin:0;padding:8px 14px;font-size:12px;" onclick="completeDay('${scTab}',${viewWeek},${di})">${done ? 'Completed' : 'Mark Day Complete'}</button></div>`;
  d.items.forEach((item, exIdx) => {
    const parsed = parseSets(item.sets);
    const effectiveName = getSwappedName(scTab, di, exIdx, item.name);
    const options = [item.name, ...(item.alts||[])];
    const effortNote = item.power ? "Power target — move every rep with intent, stop when bar speed drops" : (meta.weekInBlock ? scRirLabel(meta.weekInBlock) : "");
    html += `<div style="padding:10px 18px 4px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
        <select onchange="setSwap('${scTab}',${di},${exIdx},this.value)" style="flex:1;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:7px 9px;color:var(--text);font-size:13.5px;font-weight:600;">
          ${options.map(o => `<option value="${o.replace(/"/g,'&quot;')}" ${o===effectiveName?'selected':''}>${o}</option>`).join("")}
        </select>
      </div>
      <div class="desc" style="margin-top:4px;">${item.note||""}${item.note && effortNote ? ' · ' : ''}${effortNote}${item.alts && item.alts.length ? ' · '+item.alts.length+' similar options' : ''}</div>
    </div>`;
    html += `<div class="set-row head"><div></div><div>WEIGHT</div><div>REPS</div><div>LOG</div></div>`;
    for(let s=0; s<parsed.count; s++){
      const st = getSetState(p, scTab, viewWeek, di, exIdx, s);
      html += `<div class="set-row">
        <div class="set-num">${s+1}</div>
        <input type="text" value="${st.weight}" placeholder="—" onchange="updateSetField('${scTab}',${viewWeek},${di},${exIdx},${s},'weight',this.value)">
        <input type="text" value="${st.reps}" placeholder="${parsed.label}" onchange="updateSetField('${scTab}',${viewWeek},${di},${exIdx},${s},'reps',this.value)">
        <div class="log-box ${st.logged?'done':''}" onclick="toggleSetLog('${scTab}',${viewWeek},${di},${exIdx},${s})">${st.logged?icon('check'):''}</div>
      </div>`;
    }
  });
  html += `<div style="height:8px;"></div></div>`;

  return html;
}

    </div>`;
  }
  return html;
}

/* ---------------------- View: Weighted Bat Program tab (v3) ---------------- */

function renderBatProgram(){
  const p = loadBatProgram();
  let html = `<div class="page-head"><h1>Weighted Bat Program</h1><div class="sub">${WEIGHTED_BAT.overview}</div></div>`;

  if(!p.started){
    html += `<div class="card"><div class="card-title" style="margin-bottom:8px;">Start the 6-week block</div><div class="phil-text" style="font-size:13px;margin-bottom:16px;">Once started, this week's bat work is automatically added to your Daily Hitting Plan right after warm-up and tee progressions.</div><button class="btn btn-primary" style="width:auto;padding:11px 22px;" onclick="startBatProgram()">Start Program</button></div>`;
  } else if(p.currentWeek > WEIGHTED_BAT.weeks.length){
    html += `<div class="card"><div class="card-title" style="margin-bottom:6px;">Program complete</div><div class="phil-text" style="font-size:13px;margin-bottom:16px;">You finished all ${WEIGHTED_BAT.weeks.length} weeks. Check your Hitting Metrics Dashboard to compare start vs. end numbers.</div><button class="btn btn-ghost" style="width:auto;padding:9px 18px;" onclick="restartBatProgram()">Start a New Block</button></div>`;
  } else {
    html += `<div class="hint" style="margin-bottom:14px;">Started — Week ${p.currentWeek} is now included in your Daily Hitting Plan.</div>`;
  }

  html += WEIGHTED_BAT.weeks.map(w => {
    const state = !p.started ? "" : (w.wk < p.currentWeek ? "done" : (w.wk === p.currentWeek ? "current" : "future"));
    return `<div class="card" style="${state==='current' ? 'border-color:var(--accent);' : ''}${state==='future' ? 'opacity:0.55;' : ''}">
      <div class="card-head"><div class="card-title">Week ${w.wk} — ${w.focus}</div>${state==='done' ? '<span class="pill pill-green">Done</span>' : state==='current' ? '<span class="pill pill-amber">Current</span>' : ''}</div>
      <div class="phil-text" style="font-size:13px;">${w.plan}</div>
    </div>`;
  }).join("");

  if(p.started && p.currentWeek <= WEIGHTED_BAT.weeks.length){
    html += `<button class="btn btn-primary" style="width:auto;padding:10px 20px;" onclick="advanceBatWeek()">Mark Week ${p.currentWeek} Complete</button>`;
  }
  return html;
}

/* ---------------------- View: Daily Hitting Plan (v3, composer) ------------ */

function renderDailyPlan(){
  const picks = loadDailyPicks();
  const bat = loadBatProgram();
  const sessionLog = loadSessionLog();

  let html = `<div class="page-head"><h1>Daily Hitting Plan</h1><div class="sub">Warm-up, tee progressions, and cool-down are in every session automatically. Add drills from Hitting Drills, and your weighted bat week joins in once that program is started.</div></div>`;
  html += `<div class="top-actions"><button class="btn btn-ghost" style="width:auto;padding:8px 14px;font-size:12px;" onclick="resetDailyPlan()">Reset Today</button><button class="btn btn-primary" style="width:auto;padding:8px 16px;font-size:12px;margin:0;" onclick="completeHittingSession()">Mark Hitting Session Complete</button></div>`;

  // v5: plain reference rows, no per-item checkboxes — completion is tracked
  // at the whole-session level via "Mark Hitting Session Complete" above.
  function block(title, items){
    let h = `<div class="section-label">${title}</div><div class="item-block"><div style="padding-top:6px;">`;
    h += items.map(it => `<div class="simple-check-row"><span class="label">${it}</span></div>`).join("");
    h += `</div></div>`;
    return h;
  }

  const warmupItems = WARMUP.categories.filter(c => !c.name.startsWith("Cool-Down")).flatMap(c => c.items.map(i => i.name));
  const cooldownItems = WARMUP.categories.filter(c => c.name.startsWith("Cool-Down")).flatMap(c => c.items.map(i => i.name));
  const teeItems = teeStationLines();

  html += block("Warm-Up", warmupItems);
  html += block("Tee Progressions", teeItems);

  if(bat.started && bat.currentWeek <= WEIGHTED_BAT.weeks.length){
    const wk = WEIGHTED_BAT.weeks[bat.currentWeek - 1];
    html += block("Weighted Bat — Week " + wk.wk + " (" + wk.focus + ")", [wk.plan]);
  } else {
    html += `<div class="section-label">Weighted Bat Program</div><div class="card"><div class="phil-text" style="font-size:12.5px;color:var(--text-dim);">Not started yet — <a href="#" onclick="go('bat-program');return false;" style="color:var(--accent);">start the program</a> to have it added here automatically.</div></div>`;
  }

  html += `<div class="section-label">Your Drills</div>`;
  if(picks.length === 0){
    html += `<div class="card"><div class="phil-text" style="font-size:12.5px;color:var(--text-dim);">No drills picked yet — head to <a href="#" onclick="go('drills-library');return false;" style="color:var(--accent);">Hitting Drills</a> and tap "+ Add to Daily Plan" on anything you want to work on today.</div></div>`;
  } else {
    html += `<div class="item-block"><div style="padding-top:6px;">` + picks.map((it, i) => {
      return `<div class="simple-check-row"><span><div class="label">${it.drill}</div><div class="desc">${it.catName}</div></span><button onclick="removeDailyPick(${i})" style="background:none;border:none;color:var(--text-mute);font-size:16px;">&times;</button></div>`;
    }).join("") + `</div></div>`;
  }

  html += block("Cool-Down", cooldownItems);

  // v5: Hitting Sessions Logged tracker — real history from completeHittingSession()
  html += `<div class="section-label">Hitting Sessions Logged</div>`;
  if(sessionLog.length === 0){
    html += `<div class="card"><div class="phil-text" style="font-size:12.5px;color:var(--text-dim);">No sessions logged yet — hit "Mark Hitting Session Complete" above once you finish today's work.</div></div>`;
  } else {
    const recent = sessionLog.slice(-10).reverse();
    html += `<div class="card"><div class="card-head"><div class="card-title">${sessionLog.length} session${sessionLog.length===1?'':'s'} logged</div><div class="card-tag">Most recent first</div></div>` +
      recent.map(s => {
        const d = new Date(s.date);
        const dateStr = d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
        const timeStr = d.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
        return `<div class="simple-check-row"><span><div class="label">${dateStr} — ${timeStr}</div><div class="desc">${s.drillCount} drill${s.drillCount===1?'':'s'}${s.batWeek ? ' · Bat Week '+s.batWeek : ''}</div></span></div>`;
      }).join("") + `</div>`;
  }

  return html;
}

function renderProgram(){

  let html = `<div class="page-head"><h1>${prog.name}</h1><div class="sub">${session.role === 'coach' ? 'Template assigned to your hitters.' : 'Your active training block.'}</div></div>`;

/* ---------------------- View: Metrics Dashboard ----------------------------- */

function renderDashboard(){
  let html = `<div class="page-head"><h1>Metrics Dashboard</h1><div class="sub">Start / mid / end block testing — Blast Motion + radar gun, benchmarked by level.</div></div>`;
  html += `<div class="metric-grid">`;
  Object.keys(METRIC_BENCHMARKS).forEach(key => {
    const b = METRIC_BENCHMARKS[key];
    const hist = METRIC_HISTORY[key];
    const latest = hist[hist.length-1].v;
    const first = hist[0].v;
    const delta = (latest-first).toFixed(1);
    const flag = flagFor(key, latest);
    html += `<div class="metric-card">
      <div class="mval">${latest}<span style="font-size:13px;color:var(--text-dim);"> ${b.unit}</span></div>
      <div class="mlabel">${b.label}</div>
      <div class="mtrend"><span class="pill ${flag.cls}">${flag.label}</span> <span style="color:var(--text-dim);">${delta>=0?'+':''}${delta} since start</span></div>
    </div>`;
  });
  html += `</div>`;

  Object.keys(METRIC_BENCHMARKS).forEach(key => {
    const b = METRIC_BENCHMARKS[key];
    const hist = METRIC_HISTORY[key];
    const max = Math.max(...hist.map(h=>h.v)) * 1.15;
    html += `<div class="chart-wrap"><div class="card-head"><div class="card-title">${b.label} trend</div><div class="card-tag">Benchmark: ${b.low}-${b.high} ${b.unit}</div></div>
      <div class="bars">` + hist.map(h => {
        const pct = Math.max(6, (h.v/max)*100);
        return `<div class="bar-col"><div class="bval">${h.v}</div><div class="bar" style="height:${pct}%;"></div><div class="blabel">${h.t}</div></div>`;
      }).join("") + `</div></div>`;
  });
  html += `<div class="hint">Sample data shown for demo purposes. Live entry connects to the Hitter Metrics Tracker in v2.</div>`;

  // v3 additions: equipment checklist, how-to-track, weekly completion tracker
  const equip = loadEquip();
  html += `<div class="section-label">Hitting Aid Checklist</div><div class="card">` +
    EQUIPMENT_LIST.map((e,i) => `<div class="simple-check-row"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;"><input type="checkbox" ${equip[i]?'checked':''} onchange="toggleEquip(${i})" style="width:17px;height:17px;"><span><div class="label">${e.name}</div><div class="desc">${e.note}</div></span></label></div>`).join("") +
    `</div>`;

  // v9: real testing protocol (was a vague one-line paragraph) — see
  // TEST_PROTOCOL definition above for sourcing.
  html += `<div class="section-label">Testing Protocol — What to Actually Do</div><div class="card">
    <div class="simple-check-row" style="border-top:none;"><span><div class="label">Warm up first</div><div class="desc">${TEST_PROTOCOL.warmup}</div></span></div>
    <div class="simple-check-row"><span><div class="label">Reps</div><div class="desc">${TEST_PROTOCOL.reps}</div></span></div>
    <div class="simple-check-row"><span><div class="label">Keep conditions identical</div><div class="desc">${TEST_PROTOCOL.conditions}</div></span></div>
    <div class="simple-check-row"><span><div class="label">Score the average, not the best</div><div class="desc">${TEST_PROTOCOL.scoring}</div></span></div>
    <div class="simple-check-row"><span><div class="label">Don't overdo it</div><div class="desc">${TEST_PROTOCOL.cap}</div></span></div>
    <div class="simple-check-row"><span><div class="label">Retest cadence</div><div class="desc">${TEST_PROTOCOL.cadence}</div></span></div>
  </div><div class="hint">Full methodology and benchmark tables live in your Hitting Philosophy &amp; Program Google Doc — this dashboard is the week-to-week snapshot of that same plan.</div>`;

  const testDay = loadTestDay();
  const weekly = loadWeekly();
  const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  html += `<div class="section-label">Weekly Metrics Completion</div><div class="card">
    <div class="card-tag" style="margin-bottom:10px;">Testing day</div>
    <div class="week-tabs" style="margin-bottom:16px;">` + DOW.map(d => `<div class="week-tab ${testDay===d?'active':''}" onclick="setTestDay('${d}')">${d}</div>`).join("") + `</div>
    <div class="card-tag" style="margin-bottom:8px;">This block's weeks</div>` +
    [1,2,3,4,5,6].map(w => `<div class="simple-check-row"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;"><input type="checkbox" ${weekly[w]?'checked':''} onchange="toggleWeekly(${w})" style="width:17px;height:17px;"><span class="label">Week ${w}${testDay ? ' — '+testDay : ''}</span></label>${weekly[w] ? '<span class="pill pill-green">Recorded</span>' : '<span class="pill pill-neutral">Pending</span>'}</div>`).join("") +
    `</div>`;

  // v9: Swing Video Self-Check — 100% client-side; the video file never
  // leaves the device (URL.createObjectURL, no upload). Rubric = HITTING_RUBRIC.
  html += `<div class="section-label">Swing Video Self-Check</div><div class="card">`;
  if(!swingVideoUrl){
    html += `<div class="phil-text" style="font-size:13px;margin-bottom:14px;">Upload a swing video and step through it against your Logger Hitting 101 checkpoints — mark the 6 positions, then score the 3 keys. The video stays on this device; nothing uploads anywhere.</div>
      <input type="file" accept="video/*" id="swing-video-input" onchange="loadSwingVideo(this)">`;
  } else {
    html += `<video id="swing-video" src="${swingVideoUrl}" controls playsinline style="width:100%;border-radius:10px;margin-bottom:14px;background:#000;"></video>`;
    html += `<div class="card-tag" style="margin-bottom:8px;">Scrub to each position, then mark it</div>`;
    html += HITTING_RUBRIC.positions.map(p => {
      const marked = swingMarks[p.n] !== undefined;
      return `<div class="simple-check-row">
        <span class="label">Position ${p.n}: ${p.name}</span>
        <span id="pos-badge-${p.n}">${marked
          ? `<span class="pill pill-green" style="cursor:pointer;" onclick="scrubTo(${swingMarks[p.n]})">Marked @ ${swingMarks[p.n].toFixed(1)}s</span>`
          : `<button class="btn btn-ghost" style="width:auto;padding:6px 14px;font-size:12px;" onclick="markSwingPosition(${p.n})">Mark current frame</button>`}</span>
      </div>`;
    }).join("");
    html += `<div class="card-tag" style="margin:18px 0 8px;">Score the 3 keys</div>`;
    html += HITTING_RUBRIC.keys.map(k => {
      const state = swingKeyState[k.id];
      return `<div class="simple-check-row" style="flex-direction:column;align-items:flex-start;gap:8px;">
        <div><div class="label">${k.label}</div><div class="desc">${k.checks.join(" ")}</div></div>
        <div style="display:flex;gap:8px;">
          <button id="key-btn-${k.id}-yes" class="btn ${state===true?'btn-primary':'btn-ghost'}" style="width:auto;padding:6px 16px;font-size:12px;" onclick="setSwingKeyState('${k.id}',true)">On point</button>
          <button id="key-btn-${k.id}-no" class="btn ${state===false?'btn-primary':'btn-ghost'}" style="width:auto;padding:6px 16px;font-size:12px;" onclick="setSwingKeyState('${k.id}',false)">Needs work</button>
        </div>
      </div>`;
    }).join("");
    html += `<div style="display:flex;gap:10px;margin-top:16px;">
      <button class="btn btn-primary" style="width:auto;padding:9px 18px;" onclick="saveSwingCheck()">Save check</button>
      <button class="btn btn-ghost" style="width:auto;padding:9px 18px;" onclick="discardSwingVideo()">Discard</button>
    </div>`;
  }
  html += `</div>`;

  const swingChecks = loadSwingChecks();
  if(swingChecks.length){
    html += `<div class="section-label">Swing Check History</div><div class="card">` +
      swingChecks.slice(-8).reverse().map(c => {
        const d = new Date(c.date);
        const needsWork = Object.values(c.keyResults||{}).filter(v => v===false).length;
        return `<div class="simple-check-row"><span class="label">${d.toLocaleDateString()} ${d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span><span class="pill ${needsWork ? 'pill-red' : 'pill-green'}">${needsWork ? needsWork+' to work on' : 'clean check'}</span></div>`;
      }).join("") + `</div>`;
  }

  return html;
}

/* ---------------------- View: Program Builder (coach) ----------------------- */

function renderBuilder(){
  if(session.role !== "coach") return `<div class="empty-state">Program Builder is coach-only.</div>`;
  const prog = programs[session.programId];
  const week = prog.weeks.find(w => w.weekNum === currentWeek) || prog.weeks[0];
  let html = `<div class="page-head"><h1>Program Builder</h1><div class="sub">${prog.name} — edit each day's assigned categories. Changes save automatically and hitters see them immediately.</div></div>`;
  html += `<div class="week-tabs">` + prog.weeks.map(w => `<div class="week-tab ${w.weekNum===currentWeek?'active':''}" onclick="setWeek(${w.weekNum});go('builder')">Week ${w.weekNum}</div>`).join("") + `</div>`;
  html += `<div class="builder-row">`;
  week.days.forEach((d, di) => {
    html += `<div class="builder-day-col"><div class="card-title" style="font-size:13px;margin-bottom:10px;">${d.name}</div>`;
    d.categories.forEach((c, ci) => {
      const cat = catSafe(c);
      html += `<div class="builder-cat-tag"><span>${cat.name}</span><button onclick="removeCat(${week.weekNum},${di},${ci})">&times;</button></div>`;
    });
    html += `<select onchange="addCat(${week.weekNum},${di},this.value);this.value='';">
      <option value="">+ Add category</option>
      ${CATEGORIES.map(c=>`<option value="${c.id}">${c.name}</option>`).join("")}
    </select></div>`;
  });
  html += `</div><div class="hint">This is a v1 template editor — assign which of the 6 categories show up on each training day. Set/rep detail per exercise is next on the roadmap.</div>`;
  return html;
}

function addCat(weekNum, dayIdx, catId){
  if(!catId) return;
  const prog = programs[session.programId];
  const week = prog.weeks.find(w => w.weekNum === weekNum);
  week.days[dayIdx].categories.push(catId);
  savePrograms(programs);
  go('builder');
}
function removeCat(weekNum, dayIdx, catIdx){
  const prog = programs[session.programId];
  const week = prog.weeks.find(w => w.weekNum === weekNum);
  week.days[dayIdx].categories.splice(catIdx, 1);
  savePrograms(programs);
  go('builder');
}
